# Lance le lint (ruff), le typage (mypy) et les tests sur chaque version de Python supportée (3.10 à 3.13).
# Doc : https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Bouton "Run workflow" dans l'onglet Actions, pour lancer la matrice à la main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      # Une version en échec n'annule pas les autres : on voit d'un coup
      # lesquelles cassent.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the package with its dev tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Lint with ruff
      run: ruff check .
    - name: Type-check with mypy
      run: mypy
    - name: Test with pytest
      run: pytest --cov
